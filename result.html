<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <div class="cursor-dot"></div>

    <nav class="navbar">

            <h1 class="logo">ScamGuard</h1>
