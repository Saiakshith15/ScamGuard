<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Job Scam Detection & Reporting System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <nav class="navbar">
        <div class="container">
            <h1 class="logo">ScamGuard</h1>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="scan.html">Scan Job</a></li>
                <li><a href="report.html">Report Scam</a></li>
                <li><a href="admin-login.html" class="active">Admin</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content">
        <section class="form-section">
            <div class="container">
                <div class="admin-login-container">
                    <h2 class="page-title">Admin Login</h2>
                    <p class="page-subtitle">Administrator access required to view database</p>

                    <div id="errorMessage" class="error-message" style="display: none;"></div>

                    <form id="adminLoginForm" class="form admin-form">
                        <div class="form-group">
                            <label for="adminUsername" class="form-label">Username</label>
                            <input 
                                type="text" 
                                id="adminUsername" 
                                name="adminUsername" 
                                class="form-input" 
                                placeholder="Enter username"
                                required
                                autocomplete="username"
                            >
                        </div>

                        <div class="form-group">
                            <label for="adminPassword" class="form-label">Password</label>
                            <input 
                                type="password" 
                                id="adminPassword" 
                                name="adminPassword" 
                                class="form-input" 
                                placeholder="Enter password"
                                required
                                autocomplete="current-password"
                            >
                        </div>

                        <button type="submit" class="btn btn-primary btn-large">Login</button>
                      
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Job Scam Detection & Reporting System. All rights reserved.</p>
        </div>
    </footer>

    <script src="cursor.js"></script>
    <script src="admin-login.js"></script>
</body>
</html>
